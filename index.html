<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Próximamente | BioFX Medicina Funcional</title>
    <link rel="icon" type="image/webp" href="assets/logos/isotipoico.webp" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inder&family=Barlow:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --primary: #2a7f8c;
      --primary-dark: #12353b;
      --secondary: #9bc431;
      --accent: #2eb198;
      --dark: #0a1818;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* FIX RESPONSIVE: Anclaje estricto para evitar scroll fantasma en móviles */
    html, body {
      width: 100%;
      height: 100%;
      /* 100dvh es mágico para móviles: ignora la barra de navegación del navegador */
      height: 100dvh; 
      overflow: hidden;
    }

    body {
      font-family: "Barlow", sans-serif;
      background: radial-gradient(circle at center, var(--primary-dark) 0%, var(--dark) 100%);
      color: var(--white);
      /* Position fixed es el truco definitivo para matar el scroll en iOS Safari */
      position: fixed; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* CONTENEDOR DE PARTÍCULAS */
    .particles-container {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden; /* Doble seguro para partículas fugadas */
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      filter: blur(5px);
      opacity: 0.2;
      will-change: transform;
    }

    /* CONTENEDOR PRINCIPAL INMERSIVO */
    .hero-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      width: 100%;
      max-width: 900px;
    }

    /* LOGO */
    .logo-wrapper {
      margin-bottom: 2rem;
      visibility: hidden;
    }

    .logo-svg {
      width: 180px;
      height: auto;
      filter: drop-shadow(0 0 20px rgba(46, 177, 152, 0.4));
      will-change: transform;
    }

    /* TIPOGRAFÍA */
    .title-wrapper {
      overflow: hidden;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }

    h1.title {
      font-family: "Inder", sans-serif;
      font-size: clamp(2.5rem, 8vw, 6rem); /* Ajustado para móviles pequeños */
      font-weight: 400;
      color: var(--white);
      line-height: 1.1;
      letter-spacing: -0.02em;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      visibility: hidden;
    }

    .title-dot {
      color: var(--secondary);
    }

    .subtitle-wrapper {
      overflow: hidden;
      margin-bottom: 2.5rem;
      width: 100%;
    }

    p.subtitle {
      font-size: clamp(1.1rem, 4vw, 1.6rem); /* Escalado fluido para tablet/móvil */
      font-weight: 400;
      color: #e0ecec;
      line-height: 1.5;
      max-width: 600px;
      margin: 0 auto;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      visibility: hidden;
    }

    /* REDES SOCIALES */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      visibility: hidden;
    }

    .social-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.03);
      color: var(--white);
      text-decoration: none;
      font-size: 1.3rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      transition: background 0.4s ease, border-color 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      will-change: transform;
    }

    .social-icon:hover {
      background: rgba(46, 177, 152, 0.2);
      border-color: var(--accent);
      transform: translateY(-5px) scale(1.1);
      box-shadow: 0 10px 25px rgba(46, 177, 152, 0.4);
      color: var(--accent);
    }

    /* MEDIA QUERIES PARA MÓVILES Y TABLETS */
    @media (max-width: 768px) {
      .hero-content {
        padding: 1.5rem;
      }
      .logo-wrapper {
        margin-bottom: 1.5rem;
      }
      .logo-svg {
        width: 140px; /* Logo ligeramente más pequeño */
      }
      .subtitle-wrapper {
        margin-bottom: 2rem;
      }
      .social-links {
        gap: 1.2rem;
      }
      .social-icon {
        width: 45px;
        height: 45px;
        font-size: 1.1rem;
      }
    }

    @media (max-width: 480px) {
      .logo-svg {
        width: 120px;
      }
      h1.title {
        font-size: 2.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- Fondo de moléculas funcionales -->
  <div class="particles-container" aria-hidden="true"></div>

  <!-- Contenido Inmersivo Unificado -->
  <main class="hero-content">
    <div class="logo-wrapper">
      <svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1024">
        <defs>
          <linearGradient id="logo-gradient" x1="1269.14" y1="539.84" x2="21.22" y2="492.75" gradientTransform="translate(0 1024) scale(1 -1)" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#b4d347" />
            <stop offset="1" stop-color="#20b255" />
          </linearGradient>
        </defs>
        <path d="M1207.36,563.51c-16.51,10.14-35.34,15.84-54.45,17.11-.61.06-1.27.11-1.88.11-104.35,7.76-175.63,49.74-164.28,212.63,3.77,53.73-14.9,108.73-56,149.77-75.27,75.33-197.4,75.33-272.67,0-35.5-35.45-54.28-81.42-56.27-127.89,0-.28,0-.55-.05-.83-8.09-180.23-79.26-285.3-319.81-275.11-.39,0-.72.06-1.11.06-69.62,2.99-140.24-22.04-193.41-75.22-100.58-100.58-100.58-263.7,0-364.34,100.63-100.58,263.75-100.58,364.34,0,53.17,53.17,78.21,123.79,75.22,193.42,0,.39-.06.72-.06,1.11-10.19,240.55,94.88,311.72,275.11,319.81.28.05.55.05.83.05,1.66.06,3.32.11,4.99.28,163.89,11.41,205.38-60.76,212.74-166.16l.28.28c2.55-38.11,22.65-75.22,60.32-98.26,38-23.26,88.23-23.26,126.17,0,80.87,49.41,80.87,163.78,0,213.19h-.01Z" fill="url(#logo-gradient)"/>
      </svg>
    </div>
    
    <div class="title-wrapper">
      <h1 class="title">Próximamente<span class="title-dot">.</span></h1>
    </div>
    
    <div class="subtitle-wrapper">
      <p class="subtitle">Estamos formulando la mejor experiencia en medicina funcional para transformar tu salud.</p>
    </div>

    <!-- Redes sociales ahora son parte del bloque central -->
    <div class="social-links">
      <a href="https://www.facebook.com/BioFXvidafuncional?locale=es_LA" target="_blank" class="social-icon" aria-label="Facebook">
        <i class="fab fa-facebook-f"></i>
      </a>
      <a href="https://www.instagram.com/biofxvf/" target="_blank" class="social-icon" aria-label="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
      <a href="https://wa.me/+593958639619" target="_blank" class="social-icon" aria-label="WhatsApp">
        <i class="fab fa-whatsapp"></i>
      </a>
    </div>
  </main>

  <!-- GSAP Core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    function splitTextLines(selector) {
      const el = document.querySelector(selector);
      if (!el) return [];
      
      const text = el.textContent.trim();
      el.innerHTML = "";
      
      const words = text.split(" ");
      const elements = [];
      
      words.forEach((word, index) => {
        const span = document.createElement("span");
        span.style.display = "inline-block";
        span.innerText = word;
        
        el.appendChild(span);
        elements.push(span);
        
        if (index < words.length - 1) {
          el.appendChild(document.createTextNode(" "));
        }
      });
      return elements;
    }

    document.addEventListener("DOMContentLoaded", () => {
      
      function generarParticulas() {
        const container = document.querySelector('.particles-container');
        const colores = ['#9bc431', '#2eb198', '#2a7f8c'];
        const fragment = document.createDocumentFragment();
        
        // Reducimos cantidad en móviles para mejor rendimiento
        const isMobile = window.innerWidth <= 768;
        const cantidad = isMobile ? 12 : 20;

        for (let i = 0; i < cantidad; i++) {
          const particle = document.createElement('div');
          particle.className = 'particle';
          
          const size = gsap.utils.random(15, isMobile ? 50 : 80);
          gsap.set(particle, {
            width: size,
            height: size,
            backgroundColor: gsap.utils.random(colores),
            x: `${gsap.utils.random(0, 100)}vw`,
            y: `${gsap.utils.random(0, 100)}vh`
          });
          
          fragment.appendChild(particle);

          gsap.to(particle, {
            x: `+=${gsap.utils.random(-150, 150)}`,
            y: `+=${gsap.utils.random(-150, 150)}`,
            duration: gsap.utils.random(15, 40),
            repeat: -1,
            yoyo: true,
            ease: "sine.inOut"
          });
        }
        container.appendChild(fragment);
      }

      const mm = gsap.matchMedia();

      mm.add({
        reduceMotion: "(prefers-reduced-motion: reduce)",
        allowMotion: "(prefers-reduced-motion: no-preference)"
      }, (context) => {
        const { reduceMotion, allowMotion } = context.conditions;

        if (reduceMotion) {
          gsap.set([".logo-wrapper", ".title", ".subtitle", ".social-links"], { autoAlpha: 1 });
          return;
        }

        if (allowMotion) generarParticulas();

        const subtitleWords = splitTextLines(".subtitle");

        gsap.set([".logo-wrapper", ".title", ".subtitle", ".social-links"], { autoAlpha: 1 });

        const tl = gsap.timeline({ defaults: { ease: "power4.out" } });

        tl.from(".logo-wrapper", {
          y: -40,
          autoAlpha: 0,
          scale: 0.9,
          duration: 1.5
        })
        .from(".title", {
          yPercent: 120,
          duration: 1.2,
          ease: "expo.out"
        }, "-=1")
        .from(subtitleWords, {
          y: 30,
          autoAlpha: 0,
          duration: 0.8,
          stagger: 0.04
        }, "-=0.8")
        .from(".social-icon", {
          y: 40,
          autoAlpha: 0,
          duration: 0.8,
          stagger: 0.1,
          ease: "back.out(1.2)"
        }, "-=0.6");

        gsap.to(".logo-svg", {
          y: -10,
          duration: 4,
          repeat: -1,
          yoyo: true,
          ease: "sine.inOut"
        });

      });
    });
  </script>
</body>
</html>
