<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Continuar Pago - Bio-fx</title>
    <link rel="icon" type="image/png" href="../logos/isotipoico.webp" />
    <link rel="stylesheet" href="continuar_pago.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="confirmation-container">
      <div class="confirmation-content">
        
        <div class="header-section">
            <div class="confirmation-icon pending-icon">
                <i class="fas fa-clock"></i>
            </div>
            <h1 id="title">Pago Pendiente</h1>
            <p id="desc">Tienes una sesión de pago activa. Revisa los detalles y decide cómo continuar.</p>
        </div>

        <div id="loader" class="loader-container">
            <i class="fas fa-spinner fa-spin"></i> Cargando detalles...
        </div>

        <div id="orderDetails" style="display: none;">
            
            <div class="products-container">
                <h3>Resumen de la Orden</h3>
                <div id="productsList" class="products-list">
                    </div>
            </div>

            <div class="order-summary-box">
                <div class="summary-row">
                    <span class="summary-label">Referencia:</span>
                    <span class="summary-value" id="orderReference">---</span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">Subtotal:</span>
                    <span class="summary-value" id="orderSubtotal">---</span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">Descuentos:</span>
                    <span class="summary-value discount-value" id="orderDiscount">---</span>
                </div>
                <div class="summary-row total-row">
                    <span class="summary-label">Total a Pagar:</span>
                    <span class="summary-value" id="orderTotal">---</span>
                </div>
            </div>

            <div class="actions-container">
                <button id="btnCancel" class="btn btn-danger">
                    <i class="fas fa-times"></i> Cancelar Pago
                </button>
                <button id="btnContinue" class="btn btn-primary">
                    Continuar con el Pago <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>

      </div>
    </div>

    <script>
      window.API_BASE_URL = window.API_BASE_URL || "https://api.biofx.com.ec";
    </script>
    <script src="../api-service.js"></script>
    <script src="continuar_pago.js"></script>
  </body>
</html>
